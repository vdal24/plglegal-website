    <path d="M77.5 26 C77.5 18 82 14.5 88 14.5 C94 14.5 98.5 18 98.5 26 L98.5 33 C98.5 41 94 46.5 88 46.5 C82 46.5 77.5 41 77.5 33 Z" fill="url(#skin)"/>
    <path d="M77.5 26 C77.5 18 82 14.5 88 14.5 C84 15.5 80.5 19 80 26 L80 34 C80 39 82 43 85 45.6 C80.6 44.4 77.5 39.6 77.5 33 Z" fill="#b97a56" opacity=".28"/>

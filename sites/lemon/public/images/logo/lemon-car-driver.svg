    <path d="M78.2 20 C77.8 22 77.8 24 78 26.5 L80 27 C79.8 24.6 79.8 22 80.4 19.8 Z M97.8 20 C98.2 22 98.2 24 98 26.5 L96 27 C96.2 24.6 96.2 22 95.6 19.8 Z" fill="#5a4c42" opacity=".5"/>
    <g stroke="#2c241f" stroke-width=".35" fill="none" stroke-linecap="round" opacity=".45">
      <path d="M81 18.6 C81.4 14.6 84 11.4 88 10.2"/><path d="M84 18.2 C84.4 14.4 86.8 11.4 90.4 10.2"/><path d="M87 18.5 C87.4 14.6 89.6 11.6 92.8 10.6"/><path d="M90 18.4 C90.6 14.8 92.6 12.2 95.2 11.4"/><path d="M93 18.1 C93.8 15.2 95.4 13.2 97.2 12.8"/>
    </g>

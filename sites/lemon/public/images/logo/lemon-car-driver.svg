    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".45" stop-color="#cfd2d4"/>
      <stop offset="1" stop-color="#7d8285"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6fcf5a"/>
      <stop offset="1" stop-color="#1f7a35"/>
    </linearGradient>
    <pattern id="pores" width="7" height="6" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r=".7" fill="#a87a00" opacity=".28"/>
      <circle cx="5.5" cy="5" r=".6" fill="#fff8b0" opacity=".35"/>
    </pattern>
    <clipPath id="body">
      <path d="M10 54 C10 50 14 46 20 44 C30 24 54 16 80 16 C106 16 128 24 138 42 C144 44 150 49 150 54 C150 59 144 64 138 66 C128 84 106 90 80 90 C54 90 30 84 20 66 C14 64 10 59 10 54 Z"/>
    </clipPath>
  <linearGradient id="suit" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2a3a66"/><stop offset="1" stop-color="#141d3a"/></linearGradient>
<radialGradient id="skin" cx="45%" cy="40%" r="65%"><stop offset="0" stop-color="#f0c6a2"/><stop offset=".7" stop-color="#deaa84"/><stop offset="1" stop-color="#c88f6a"/></radialGradient>
<pattern id="stripes" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(40)"><rect width="4" height="4" fill="#1d2b55"/><rect width="1.3" height="4" fill="#c9d1e6"/></pattern><linearGradient id="hair" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#3a3029"/><stop offset=".55" stop-color="#4a3e35"/><stop offset=".8" stop-color="#6a5c50"/><stop offset="1" stop-color="#3f352e"/></linearGradient>
<linearGradient id="beard" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4a3d34"/><stop offset="1" stop-color="#352b24"/></linearGradient></defs>
  <g transform="translate(0 30)">

  <!-- ground shadow -->
  <ellipse cx="80" cy="104" rx="58" ry="5" fill="#000" opacity=".22"/>

  <!-- far-side wheels peeking out -->
  <circle cx="50" cy="86" r="14" fill="#141412"/>
  <circle cx="114" cy="86" r="14" fill="#141412"/>

  </g>
  <g transform="translate(-2 -11)">

  </g>
  <g transform="translate(0 30)">
  <!-- stem and leaf at the back -->
  <path d="M34 52 C32 47 31 44 28 41" stroke="#5c4410" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M28.5 42 C22 33 6 34 1 39 C8 46 22 48 28.5 42 Z" fill="url(#leaf)"/>
  <path d="M27.5 42 C19 39.5 9 38.6 2 39" stroke="#17602a" stroke-width="1.2" fill="none"/><!-- lemon body -->
  <path d="M10 54 C10 50 14 46 20 44 C30 24 54 16 80 16 C106 16 128 24 138 42 C144 44 150 49 150 54 C150 59 144 64 138 66 C128 84 106 90 80 90 C54 90 30 84 20 66 C14 64 10 59 10 54 Z" fill="url(#peel)"/>
  <g clip-path="url(#body)">
    <rect x="0" y="0" width="160" height="112" fill="url(#pores)"/>
    <rect x="0" y="0" width="160" height="112" fill="url(#belly)"/>
    <!-- rim light along the bottom edge -->
    <path d="M24 70 C36 84 58 90 80 90 C104 90 124 84 136 70" stroke="#fff3a0" stroke-width="2" fill="none" opacity=".45"/>
  </g>
  <!-- nubs at each end -->
  <path d="M150 54 C150 51 153 50 156 52 C158 53 158 55 156 56 C153 58 150 57 150 54 Z" fill="#e2ad00"/>
  <path d="M10 54 C10 51 7 50 5 52 C3 53 3 55 5 56 C7 58 10 57 10 54 Z" fill="#d9a400"/>

  <!-- shine -->
  <ellipse cx="58" cy="32" rx="22" ry="7" fill="#fff" opacity=".55" transform="rotate(-12 58 32)"/>
  <ellipse cx="44" cy="40" rx="5" ry="2.4" fill="#fff" opacity=".7" transform="rotate(-20 44 40)"/>

  <!-- headlight -->
  <ellipse cx="141" cy="52" rx="3.2" ry="2.4" fill="#fffde8"/>
  <ellipse cx="141" cy="52" rx="1.5" ry="1.1" fill="#fff"/>

  <!-- near-side wheels -->
  <g>
    <circle cx="46" cy="86" r="15" fill="url(#tire)"/>
    <circle cx="46" cy="86" r="8.5" fill="url(#rim)"/>
    <g stroke="#8b9093" stroke-width="1.6" stroke-linecap="round">
      <path d="M46 79 V93 M39 86 H53 M41 81 L51 91 M51 81 L41 91"/>
    <animateTransform attributeName="transform" type="rotate" from="0 46 86" to="360 46 86" dur=".7s" repeatCount="indefinite"/></g>
    <circle cx="46" cy="86" r="3" fill="#ffd60a" stroke="#7a5f00" stroke-width=".8"/>
  </g>
  <g>
    <circle cx="112" cy="86" r="15" fill="url(#tire)"/>
    <circle cx="112" cy="86" r="8.5" fill="url(#rim)"/>
    <g stroke="#8b9093" stroke-width="1.6" stroke-linecap="round">
      <path d="M112 79 V93 M105 86 H119 M107 81 L117 91 M117 81 L107 91"/>
    <animateTransform attributeName="transform" type="rotate" from="0 112 86" to="360 112 86" dur=".7s" repeatCount="indefinite"/></g>
    <circle cx="112" cy="86" r="3" fill="#ffd60a" stroke="#7a5f00" stroke-width=".8"/>
  </g>
</g>
  <!-- windshield -->
  <path d="M99 47 C100 40 102 35 106 32 L109 33 C107 37 106 42 106 47.5 Z" fill="#d6eefa" opacity=".7" stroke="#1a1a17" stroke-width="1.3" stroke-linejoin="round"/>
  <path d="M101.4 44 C102 40 103.4 37 105 35" stroke="#fff" stroke-width="1.1" opacity=".9" stroke-linecap="round" fill="none"/>
</svg>

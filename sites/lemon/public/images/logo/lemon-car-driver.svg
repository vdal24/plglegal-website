    <path d="M77.5 28.6 C78 31.6 79.4 33.4 81.4 34.2 C80.6 35.6 80.4 38 81 40.4 C78.2 38 77.2 33.4 77.5 28.6 Z" fill="#5a4a3f" opacity=".55"/>
    <!-- mustache and smile -->

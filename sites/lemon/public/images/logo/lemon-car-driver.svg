<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -10 160 152" width="160" height="152">
  <defs>
    <radialGradient id="peel" cx="38%" cy="30%" r="75%">
      <stop offset="0" stop-color="#fffbd1"/>
      <stop offset=".18" stop-color="#ffec5c"/>
      <stop offset=".5" stop-color="#ffd60a"/>
      <stop offset=".8" stop-color="#e9b400"/>
      <stop offset="1" stop-color="#b98600"/>
    </radialGradient>
    <linearGradient id="belly" x1="0" y1="0" x2="0" y2="1">
      <stop offset=".55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#6b4a00" stop-opacity=".35"/>
    </linearGradient>
    <radialGradient id="tire" cx="50%" cy="45%" r="55%">

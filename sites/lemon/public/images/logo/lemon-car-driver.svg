    <path d="M81.8 28.4 C82.9 29 84.4 29 85.4 28.4 M90.6 28.4 C91.6 29 93.1 29 94.2 28.4" stroke="#b97a56" stroke-width=".5" fill="none" opacity=".7"/>
    <!-- nose -->
    <path d="M88.4 27.5 C88.6 30 89.4 31.6 89.8 32.6" stroke="#b47552" stroke-width=".8" fill="none" stroke-linecap="round" opacity=".8"/>

    <path d="M70 62 C70 52 77 47 88 47 C99 47 106 52 106 62 Z" fill="url(#suit)"/>
    <path d="M83 47 L88 58 L93 47 Z" fill="#fff"/>
    <path d="M86.6 49.5 L89.4 49.5 L90.6 60 L88 63 L85.4 60 Z" fill="url(#stripes)"/>
